databaseChangeLog:

  - changeSet:
      id: 002-create-payments
      author: anton
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: order_id
                  type: INT
                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_payments_order
                    references: orders(id)